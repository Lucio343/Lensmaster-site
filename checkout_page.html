<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Payment and Checkout</title>
        <h1>Payment and Checkout</h1>
        <link rel="stylesheet" href="checkout.css">
    </head>
    <body>
        <form>
            <label for="Cnumber">Card number</label>
            <input type="text" id="Cnumber" name="Cnumber" maxlength="16">
            <label for="Expdate">Expiry date</label>
            <input type="date" id="Expdate" name="Expdate">
            <label for="CVC">Security number (CVV)</label>
            <input type="password" id="CVC" name="CVC" maxlength="3">
            <label for="Cholder">Cardholder name</label>
            <input type="text" id="Cholder" name="Cholder">
        </form>
    </body>
</html>
