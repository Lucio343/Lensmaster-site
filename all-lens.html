            // Function to display lenses in the table
            function displayLenses(filteredLenses) {
                const tableBody = document.querySelector("#lensTable tbody");
                tableBody.innerHTML = ""; // Clear previous rows
                filteredLenses.forEach(lens => {
                    const row = `
                        <tr>
                            <td>${lens.id}</td>
                            <td>${lens.name}</td>
                            <td>${lens.focal_length}mm</td>
                            <td>${lens.max_aperture}</td>
                            <td>${lens.type}</td>
                            <td>${lens.compatibility}</td>
                            <td>$${lens.price.toFixed(2)}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            }
    
            // Initial display of all lenses
            displayLenses(lenses);
    
            // Function to filter lenses
            function applyFilters() {
                const minFocal = parseInt(document.getElementById("minFocal").value) || 0;
                const maxFocal = parseInt(document.getElementById("maxFocal").value) || Infinity;
                const minPrice = parseFloat(document.getElementById("minPrice").value) || 0;
                const maxPrice = parseFloat(document.getElementById("maxPrice").value) || Infinity;
    
                const filteredLenses = lenses.filter(lens => {
                    // Convert focal_length to numeric for comparison
                    const focalParts = lens.focal_length.split("-");
                    const lensMinFocal = parseInt(focalParts[0]);
                    const lensMaxFocal = focalParts.length > 1 ? parseInt(focalParts[1]) : lensMinFocal;
    
                    return (
                        lensMinFocal >= minFocal &&
                        lensMaxFocal <= maxFocal &&
                        lens.price >= minPrice &&
                        lens.price <= maxPrice
                    );
                });
    
                displayLenses(filteredLenses);
            }
    
            // Filter by type
            function filterLenses(type) {
                const filteredLenses = type === "All" ? lenses : lenses.filter(lens => lens.type === type);
                displayLenses(filteredLenses);
            }
